# 📘 PATTERN, NOT AN OFFICIAL INTEGRATION. Anthropic ships first-party integrations for GitHub Actions
# and GitLab CI/CD. Bitbucket Pipelines has none, but every CI system can run the Claude Code CLI in
# headless mode (`claude -p`). This file shows that pattern. To use it, copy it to the repo root as
# bitbucket-pipelines.yml and add ANTHROPIC_API_KEY as a SECURED repository variable.
#
# Two pipelines on every pull request:
#   1. checks: the deterministic gate (no AI), same as .github/workflows/ci.yml
#   2. ai-review: scripts/ci/claude-review.sh asks Claude for a read-only review, as JSON
# And one custom pipeline for a SCHEDULE:
#   3. nightly-health: scripts/ci/morning-health.sh runs the committed /morning-health skill.
#      A custom pipeline never runs on a push; attach it to a schedule in Bitbucket (from the
#      repository's Pipelines page, add a schedule for branch main and this pipeline).
#      This is the TEAM-OWNED version of the same skill people schedule on their own machines
#      (docs/automation/SCHEDULING.md): it runs whether or not anyone's laptop is on, with the
#      organization's ANTHROPIC_API_KEY from a secured repository variable, so the cost and the
#      run belong to the team rather than to one person's account.
image: node:22

definitions:
  caches:
    npm: ~/.npm

pipelines:
  pull-requests:
    "**":
      - parallel:
          - step:
              name: Checks (no AI)
              caches: [npm]
              script:
                - npm ci
                - npm run check
                - npm run build
          - step:
              name: AI review (headless claude -p)
              caches: [npm]
              # Full history, so `git diff origin/<base>...HEAD` can find the merge base.
              clone:
                depth: full
              script:
                - npm install -g @anthropic-ai/claude-code
                - export BASE_BRANCH="$BITBUCKET_PR_DESTINATION_BRANCH"
                - bash scripts/ci/claude-review.sh
              artifacts:
                - claude-review.json

  custom:
    nightly-health:
      - step:
          name: Morning health (headless claude -p, scheduled)
          caches: [npm]
          # Full history, so `git log --since=yesterday` sees every commit in the window.
          clone:
            depth: full
          script:
            - npm ci
            - npm install -g @anthropic-ai/claude-code
            - bash scripts/ci/morning-health.sh
          artifacts:
            - reports/**
