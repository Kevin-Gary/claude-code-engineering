# 📘 The deterministic quality gate. No AI runs here: lint, typecheck, unit tests, a production
# build, and the Playwright E2E suite, on every push and pull request. This is where the tests
# Claude helped you write earn their keep: they keep catching regressions long after the session.
# Any stack: same shape for any language. Install, check, build, then drive the real app.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, unit tests
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
