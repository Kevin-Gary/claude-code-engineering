# 📘 AI code review on pull requests with the official Claude Code GitHub Action.
# This mirrors the "Run a skill" example in the Claude Code docs (github-actions page): it installs
# the code-review plugin and runs its skill, which posts inline comments on the PR.
#
# Setup: install the Claude GitHub App on the repo, add the ANTHROPIC_API_KEY repository secret,
# then set the repository VARIABLE ENABLE_CLAUDE_REVIEW to "true". Until then the job is skipped,
# so forks and clones of this teaching repo do not fail for lack of a secret.
#
# Alternatives:
# - Run YOUR team's checklist instead of the plugin: change `prompt` to "/verdant-review" (the
#   checkout step makes .claude/skills available on the runner). Note that skill reviews local,
#   uncommitted changes, so in CI ask it to review `git diff origin/main...HEAD` explicitly, and
#   set `fetch-depth: 0` below so origin/main exists on the runner.
# - Anthropic's managed Code Review service needs no workflow file at all; REVIEW.md at the repo
#   root tunes what it flags.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: vars.ENABLE_CLAUDE_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
